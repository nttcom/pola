name: srmpls-explicit-path
topology:
  kinds:
    xrd:
      image: ios-xr/xrd-control-plane:24.4.1
    juniper_vjunosrouter:
      image: vrnetlab/juniper_vjunos-router:25.2R1.9
    linux:
      image: golang:1.26.5
    bridge:
      image: ghcr.io/containernet/bridge:latest
  nodes:
    pe01:
      kind: xrd
      startup-config: input/startup-configs/pe01.cfg
    pe02:
      kind: juniper_vjunosrouter
      startup-config: input/startup-configs/pe02.cfg
    pe03:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - input/startup-configs/pe03/daemons:/etc/frr/daemons
        - input/startup-configs/pe03/vtysh.conf:/etc/frr/vtysh.conf
        - input/startup-configs/pe03/frr.conf:/etc/frr/frr.conf
        - input/startup-configs/pe03/vtysh.sh:/vtysh.sh
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.mpls.conf.lo.input=1
        - sysctl -w net.mpls.conf.eth1.input=1
        - sysctl -w net.mpls.conf.eth2.input=1
        - sysctl -w net.mpls.platform_labels=1048575
        - bash /vtysh.sh
    pola:
      kind: linux
      startup-delay: 10
      binds:
        - ../../../bin/polad:/bin/polad
        - ../../../bin/pola:/bin/pola
        - input/polad.cfg.yaml:/polad.cfg.yaml
        - input/sr-policies/pe01-policy1.yaml:/pe01-policy1.yaml
        - input/sr-policies/pe02-policy1.yaml:/pe02-policy1.yaml
        - input/sr-policies/pe02-policy2.yaml:/pe02-policy2.yaml
        - input/sr-policies/pe03-policy1.yaml:/pe03-policy1.yaml
      exec:
        - apt update
        - apt install -y iproute2 iputils-ping
        - ip link set eth1 up
        - ip addr add 10.0.255.254/24 dev eth1
      cmd: /bin/polad -f /polad.cfg.yaml &
    switch:
      kind: bridge
  links:
    # SR-MPLS domain
    - endpoints: ["pe01:Gi0-0-0-0", "pe02:eth1"]
    - endpoints: ["pe01:Gi0-0-0-1", "pe03:eth1"]
    - endpoints: ["pe02:eth2", "pe03:eth2"]
    # switch
    - endpoints: ["pola:eth1", "switch:eth1"]
    - endpoints: ["pe01:Gi0-0-0-2", "switch:eth2"]
    - endpoints: ["pe02:eth3", "switch:eth3"]
    - endpoints: ["pe03:eth3", "switch:eth4"]

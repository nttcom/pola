chassis {
    network-services enhanced-ip;
}
interfaces {
    ge-0/0/0 {
        description "to:p01";
        unit 0 {
            family iso;
            family mpls;
            family inet {
                address 10.0.32.2/30;
            }
        }
    }
    ge-0/0/1 {
        description "to:p02";
        unit 0 {
            family iso;
            family mpls;
            family inet {
                address 10.0.35.2/30;
            }
        }
    }
    ge-0/0/2 {
        description "to:switch";
        unit 0 {
            family inet {
                address 10.0.60.2/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.3.2/32;
            }
            family iso {
                address 49.0000.0000.0003.0002.00;
            }
        }
    }
}
routing-options {
    router-id 10.255.3.2;
    autonomous-system 65000;
}
protocols {
    isis {
        interface ge-0/0/0.0 {
            point-to-point;
            level 2 {
                metric 10;
            }
        }
        interface ge-0/0/1.0 {
            point-to-point;
            level 2 {
                metric 100;
            }
        }
        interface lo0.0 {
            passive;
        }
        source-packet-routing {
            srgb {
                start-label 16000;
                index-range 8000;
            }
            node-segment {
                ipv4-index 32;
            }
        }
        level 1 disable;
        level 2 {
            wide-metrics-only;
        }
    }
    mpls {
        lsp-external-controller pccd;
        icmp-tunneling;
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
    }
    pcep {
        pce POLA {
            local-address 10.0.60.2;
            destination-ipv4-address 10.0.60.3;
            pce-type active;
            pce-type stateful;
            lsp-provisioning;
            spring-capability;
        }
    }
    source-packet-routing {
        lsp-external-controller pccd;
    }
}

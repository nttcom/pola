hostname p01
username admin
 group root-lr
 group cisco-support
 secret admin@123
!
grpc
 vrf MGMT
 no-tls
 address-family dual
!
vrf MGMT
 address-family ipv4 unicast
 !
 address-family ipv6 unicast
 !
!
line default
 transport input ssh
!
call-home
 service active
 contact smart-licensing
 profile CiscoTAC-1
  active
  destination transport-method email disable
  destination transport-method http
 !
!
netconf-yang agent
 ssh
!
interface Loopback0
 ipv4 address 10.255.3.4 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description to:pe01
 ipv4 address 10.0.31.2 255.255.255.252
!
interface GigabitEthernet0/0/0/1
 description to:pe02
 ipv4 address 10.0.32.1 255.255.255.252
!
interface GigabitEthernet0/0/0/2
 description to:pe03
 ipv4 address 10.0.33.1 255.255.255.252
!
router isis 1
 is-type level-2-only
 net 49.0000.0000.0003.0004.00
 segment-routing global-block 16000 23999
 address-family ipv4 unicast
  metric-style wide
  segment-routing mpls
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
   prefix-sid index 34
  !
 !
 interface GigabitEthernet0/0/0/0
  circuit-type level-2-only
  point-to-point
  hello-interval 1
  address-family ipv4 unicast
   metric 10 level 2
  !
 !
 interface GigabitEthernet0/0/0/1
  circuit-type level-2-only
  point-to-point
  hello-interval 1
  address-family ipv4 unicast
   metric 10 level 2
  !
 !
 interface GigabitEthernet0/0/0/2
  circuit-type level-2-only
  point-to-point
  hello-interval 1
  address-family ipv4 unicast
   metric 10 level 2
  !
 !
!
mpls oam
!
ssh server v2
ssh server vrf MGMT
ssh server netconf vrf MGMT
end

hostname p02
username admin
 group root-lr
 group cisco-support
 secret admin@123
!
grpc
 vrf MGMT
 no-tls
 address-family dual
!
vrf MGMT
 address-family ipv4 unicast
 !
 address-family ipv6 unicast
 !
!
line default
 transport input ssh
!
call-home
 service active
 contact smart-licensing
 profile CiscoTAC-1
  active
  destination transport-method email disable
  destination transport-method http
 !
!
netconf-yang agent
 ssh
!
interface Loopback0
 ipv4 address 10.255.4.3 255.255.255.255
!
interface Loopback1
 ipv6 address 2001:db8:400:1::3/128
!
interface GigabitEthernet0/0/0/0
 description to:pe01
 ipv4 address 10.0.46.2 255.255.255.252
 ipv6 address 2001:db8:40:3::2/64
!
interface GigabitEthernet0/0/0/1
 description to:pe02
 ipv4 address 10.0.47.1 255.255.255.252
!
router ospf 1
 router-id 10.255.4.3
 segment-routing mpls
 area 0
  interface Loopback0
   passive enable
   prefix-sid index 43
  !
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
  !
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
   mtu-ignore
  !
 !
!
router ospfv3 1
 router-id 10.255.4.3
 area 0
  interface Loopback1
   passive
  !
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
  !
 !
!
mpls oam
!
ssh server v2
ssh server vrf MGMT
ssh server netconf vrf MGMT
end

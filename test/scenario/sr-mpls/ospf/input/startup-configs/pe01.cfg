hostname pe01
username admin
 group root-lr
 group cisco-support
 secret admin@123
!
grpc
 vrf MGMT
 no-tls
 address-family dual
!
vrf MGMT
 address-family ipv4 unicast
 !
 address-family ipv6 unicast
 !
!
line default
 transport input ssh
!
call-home
 service active
 contact smart-licensing
 profile CiscoTAC-1
  active
  destination transport-method email disable
  destination transport-method http
 !
!
netconf-yang agent
 ssh
!
interface Loopback0
 ipv4 address 10.255.4.1 255.255.255.255
!
interface Loopback1
 ipv6 address 2001:db8:400:1::1/128
!
interface GigabitEthernet0/0/0/0
 description to:p01
 ipv4 address 10.0.44.1 255.255.255.252
 ipv6 address 2001:db8:40:1::1/64
!
interface GigabitEthernet0/0/0/1
 description to:p02
 ipv4 address 10.0.46.1 255.255.255.252
 ipv6 address 2001:db8:40:3::1/64
!
interface GigabitEthernet0/0/0/2
 description to:switch(bgp-ls)
 ipv4 address 10.0.50.1 255.255.255.0
!
router ospf 1
 router-id 10.255.4.1
 distribute link-state instance-id 1
 segment-routing mpls
 area 0
  interface Loopback0
   passive enable
   prefix-sid index 41
  !
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 5
  !
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
  !
 !
!
router ospfv3 1
 router-id 10.255.4.1
 area 0
  interface Loopback1
   passive
  !
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 5
  !
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
  !
 !
!
router bgp 65000
 bgp router-id 10.255.4.1
 address-family link-state link-state
 !
 neighbor 10.0.50.4
  remote-as 65000
  update-source GigabitEthernet0/0/0/2
  address-family link-state link-state
  !
 !
!
mpls oam
!
segment-routing
 traffic-eng
  pcc
   source-address ipv4 10.0.50.1
   pce address ipv4 10.0.50.3
   !
   report-all
  !
 !
!
ssh server v2
ssh server vrf MGMT
ssh server netconf vrf MGMT
end

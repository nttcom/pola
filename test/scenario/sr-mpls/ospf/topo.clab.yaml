name: sr-mpls-ospf
topology:
  kinds:
    xrd:
      image: ios-xr/xrd-control-plane:24.4.1
    linux:
      image: golang:1.26.5
  nodes:
    pe01:
      kind: xrd
      startup-config: input/startup-configs/pe01.cfg
    p01:
      kind: xrd
      startup-config: input/startup-configs/p01.cfg
    p02:
      kind: xrd
      startup-config: input/startup-configs/p02.cfg
    pe02:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      binds:
        - input/startup-configs/pe02/daemons:/etc/frr/daemons
        - input/startup-configs/pe02/vtysh.conf:/etc/frr/vtysh.conf
        - input/startup-configs/pe02/frr.conf:/etc/frr/frr.conf
        - input/startup-configs/pe02/vtysh.sh:/vtysh.sh
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.mpls.conf.lo.input=1
        - sysctl -w net.mpls.conf.eth1.input=1
        - sysctl -w net.mpls.conf.eth2.input=1
        - sysctl -w net.mpls.platform_labels=1048575
        - bash /vtysh.sh
        # Work around an FRR 10.7.1 startup issue with Prefix-SID LSA origination.
        - vtysh -c "clear ip ospf process"
    gobgp:
      kind: linux
      binds:
        - ../../../bin/gobgpd:/bin/gobgpd
        - ../../../bin/gobgp:/bin/gobgp
        - input/gobgpd.yaml:/gobgpd.yaml
      exec:
        - apt update
        - apt install -y iproute2 iputils-ping
        - ip link set eth1 up
        - ip addr add 10.0.50.4/24 dev eth1
      cmd: /bin/gobgpd -f /gobgpd.yaml &
    pola:
      kind: linux
      startup-delay: 10
      binds:
        - ../../../bin/polad:/bin/polad
        - ../../../bin/pola:/bin/pola
        - input/polad.yaml:/polad.yaml
        - input/sr-policies/pe01-ipv4.yaml:/pe01-ipv4.yaml
        - input/sr-policies/pe01-ipv6.yaml:/pe01-ipv6.yaml
        - input/sr-policies/pe01-explicit.yaml:/pe01-explicit.yaml
        - input/sr-policies/pe02-dynamic-ipv4.yaml:/pe02-dynamic-ipv4.yaml
      exec:
        - apt update
        - apt install -y iproute2 iputils-ping
        - ip link set eth1 up
        - ip addr add 10.0.50.3/24 dev eth1
      cmd: /bin/polad -f /polad.yaml &
    switch:
      kind: linux
      image: wbitt/network-multitool:latest
      exec:
        - ip link add name br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth1 up
        - ip link set eth2 master br0
        - ip link set eth2 up
        - ip link set eth3 master br0
        - ip link set eth3 up
        - ip link set eth4 master br0
        - ip link set eth4 up
  links:
    # OSPF core
    - endpoints: ["pe01:Gi0-0-0-0", "p01:Gi0-0-0-0"]
    - endpoints: ["pe01:Gi0-0-0-1", "p02:Gi0-0-0-0"]
    - endpoints: ["pe02:eth1", "p01:Gi0-0-0-1"]
    - endpoints: ["pe02:eth2", "p02:Gi0-0-0-1"]
    # switch
    - endpoints: ["pe01:Gi0-0-0-2", "switch:eth1"]
    - endpoints: ["pe02:eth3", "switch:eth2"]
    - endpoints: ["pola:eth1", "switch:eth3"]
    - endpoints: ["gobgp:eth1", "switch:eth4"]

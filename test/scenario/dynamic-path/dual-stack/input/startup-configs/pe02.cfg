chassis {
    network-services enhanced-ip;
}

interfaces {
    ge-0/0/0 {
        description "to:p01";
        unit 0 {
            family inet {
                address 10.0.21.2/30;
            }
            family iso;
            family inet6 {
                address 2001:db8:20:2::2/64;
            }
            family mpls;
        }
    }
    ge-0/0/1 {
        description "to:p02";
        unit 0 {
            family inet {
                address 10.0.23.2/30;
            }
            family iso;
            family inet6 {
                address 2001:db8:20:4::2/64;
            }
            family mpls;
        }
    }
    ge-0/0/2 {
        description "to:switch(pcep)";
        unit 0 {
            family inet {
                address 10.0.30.2/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.2.4/32;
            }
            family iso {
                address 49.0000.0000.0002.0004.00;
            }
            family inet6 {
                address 2001:db8:200:4::1/128;
            }
        }
    }
}

routing-options {
    router-id 10.255.2.4;
    autonomous-system 65000;
}

protocols {
    isis {
        level 1 disable;
        level 2 {
            wide-metrics-only;
        }
        topologies {
            ipv6-unicast;
        }
        source-packet-routing {
            srgb {
                start-label 16000;
                index-range 8000;
            }
            node-segment {
                ipv4-index 24;
                ipv6-index 124;
            }
        }
        interface ge-0/0/0.0 {
            point-to-point;
            level 2 {
                metric 10;
                ipv6-unicast-metric 100;
            }
        }
        interface ge-0/0/1.0 {
            point-to-point;
            level 2 {
                metric 100;
                ipv6-unicast-metric 10;
            }
        }
        interface lo0.0 {
            passive;
        }
    }
    mpls {
        lsp-external-controller pccd;
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
    }
    source-packet-routing {
        lsp-external-controller pccd;
        preserve-nexthop-hierarchy;
    }
    pcep {
        pce POLA-PCE {
            local-ipv4-address 10.0.30.2;
            destination-ipv4-address 10.0.30.3;
            pce-type active;
            pce-type stateful;
            lsp-provisioning;
            spring-capability;
        }
    }
}

hostname pe02
username admin
 group root-lr
 group cisco-support
 secret admin@123
!
grpc
 vrf MGMT
 no-tls
 address-family dual
!
vrf MGMT
 address-family ipv4 unicast
 !
 address-family ipv6 unicast
 !
!
line default
 transport input ssh
!
call-home
 service active
 contact smart-licensing
 profile CiscoTAC-1
  active
  destination transport-method email disable
  destination transport-method http
 !
!
netconf-yang agent
 ssh
!
interface Loopback0
 ipv4 address 10.255.2.4 255.255.255.255
!
interface Loopback1
 ipv6 address 2001:db8:200:4::1/128
!
interface GigabitEthernet0/0/0/0
 description to:p01
 ipv4 address 10.0.21.2 255.255.255.252
 ipv6 address 2001:db8:20:2::2/64
!
interface GigabitEthernet0/0/0/1
 description to:p02
 ipv4 address 10.0.23.2 255.255.255.252
 ipv6 address 2001:db8:20:4::2/64
!
interface GigabitEthernet0/0/0/2
 description to:switch(pcep)
 ipv4 address 10.0.30.2 255.255.255.0
!
router isis 1
 is-type level-2-only
 net 49.0000.0000.0002.0004.00
 segment-routing global-block 16000 23999
 address-family ipv4 unicast
  metric-style wide
  segment-routing mpls
 !
 address-family ipv6 unicast
  metric-style wide
  segment-routing mpls
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
   prefix-sid index 24
  !
 !
 interface Loopback1
  passive
  address-family ipv6 unicast
   prefix-sid index 124
  !
 !
 interface GigabitEthernet0/0/0/0
  circuit-type level-2-only
  point-to-point
  hello-interval 1
  address-family ipv4 unicast
   metric 10 level 2
  !
  address-family ipv6 unicast
   metric 100 level 2
  !
 !
 interface GigabitEthernet0/0/0/1
  circuit-type level-2-only
  point-to-point
  hello-interval 1
  address-family ipv4 unicast
   metric 100 level 2
  !
  address-family ipv6 unicast
   metric 10 level 2
  !
 !
!
mpls oam
!
segment-routing
 traffic-eng
  pcc
   source-address ipv4 10.0.30.2
   pce address ipv4 10.0.30.3
   !
   report-all
  !
 !
!
ssh server v2
ssh server vrf MGMT
ssh server netconf vrf MGMT
end

hostname pe01
username admin
 group root-lr
 group cisco-support
 secret admin@123
!
grpc
 vrf MGMT
 no-tls
 address-family dual
!
vrf MGMT
 address-family ipv4 unicast
 !
 address-family ipv6 unicast
 !
!
line default
 transport input ssh
!
call-home
 service active
 contact smart-licensing
 profile CiscoTAC-1
  active
  destination transport-method email disable
  destination transport-method http
 !
!
netconf-yang agent
 ssh
!
interface Loopback0
 ipv4 address 10.255.2.1 255.255.255.255
!
interface Loopback1
 ipv6 address 2001:db8:200:1::1/128
!
interface GigabitEthernet0/0/0/0
 description to:p01
 ipv4 address 10.0.20.1 255.255.255.252
 ipv6 address 2001:db8:20:1::1/64
!
interface GigabitEthernet0/0/0/1
 description to:p02
 ipv4 address 10.0.22.1 255.255.255.252
 ipv6 address 2001:db8:20:3::1/64
!
interface GigabitEthernet0/0/0/2
 description to:switch(bgp-ls)
 ipv4 address 10.0.30.1 255.255.255.0
!
router isis 1
 is-type level-2-only
 net 49.0000.0000.0002.0001.00
 distribute link-state level 2
 segment-routing global-block 16000 23999
 address-family ipv4 unicast
  metric-style wide
  segment-routing mpls
 !
 address-family ipv6 unicast
  metric-style wide
  segment-routing mpls
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
   prefix-sid index 21
  !
 !
 interface Loopback1
  passive
  address-family ipv6 unicast
   prefix-sid index 121
  !
 !
 interface GigabitEthernet0/0/0/0
  circuit-type level-2-only
  point-to-point
  hello-interval 1
  address-family ipv4 unicast
   metric 10 level 2
  !
  address-family ipv6 unicast
   metric 100 level 2
  !
 !
 interface GigabitEthernet0/0/0/1
  circuit-type level-2-only
  point-to-point
  hello-interval 1
  address-family ipv4 unicast
   metric 100 level 2
  !
  address-family ipv6 unicast
   metric 10 level 2
  !
 !
!
router bgp 65000
 bgp router-id 10.255.2.1
 address-family link-state link-state
 !
 neighbor 10.0.30.4
  remote-as 65000
  update-source GigabitEthernet0/0/0/2
  address-family link-state link-state
  !
 !
!
mpls oam
!
segment-routing
 traffic-eng
  pcc
   source-address ipv4 10.0.30.1
   pce address ipv4 10.0.30.3
   !
   report-all
  !
 !
!
ssh server v2
ssh server vrf MGMT
ssh server netconf vrf MGMT
end

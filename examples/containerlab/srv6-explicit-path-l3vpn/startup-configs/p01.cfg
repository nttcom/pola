chassis {
    network-services enhanced-ip;
}
interfaces {
    ge-0/0/0 {
        description "to:pe01";
        unit 0 {
            family iso;
            family inet6;
        }
    }
    ge-0/0/1 {
        description "to:pe02";
        unit 0 {
            family iso;
            family inet6;
        }
    }
    ge-0/0/2 {
        description "to:p02";
        unit 0 {
            family iso;
            family inet6;
        }
    }
    lo0 {
        unit 0 {
            family iso {
                address 49.0000.0000.0aff.0003.00;
            }
            family inet6 {
                address fd00:ffff::3/128;
            }
        }
    }
}
routing-options {
    source-packet-routing {
        srv6 {
            locator LOC1 fd00:ffff:3::/64;
        }
    }
    resolution {
        preserve-nexthop-hierarchy;
    }
    router-id 10.255.0.3;
    autonomous-system 65000;
    forwarding-table {
        srv6-chain-merge;
    }
}
protocols {
    isis {
        interface ge-0/0/0.0 {
            point-to-point;
        }
        interface ge-0/0/1.0 {
            point-to-point;
        }
        interface ge-0/0/2.0 {
            point-to-point;
        }
        interface lo0.0 {
            passive;
        }
        source-packet-routing {
            srv6 {
                locator LOC1 {
                    end-sid fd00:ffff:3:0:1::;
                }
            }
        }
        level 1 disable;
        level 2 {
            wide-metrics-only;
        }
        no-ipv4-routing;
        topologies {
            ipv6-unicast;
        }
    }
    source-packet-routing {
        srv6;
    }
}

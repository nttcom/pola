configure
chassis {
	network-services enhanced-ip;
}
interfaces {
	ge-0/0/0 {
		description to:p01;
		unit 0 {
			family {
				iso;
				inet6;
			}
		}
	}
	ge-0/0/1 {
		description to:p02;
		unit 0 {
			family {
				iso;
				inet6;
			}
		}
	}
	ge-0/0/2 {
		description to:host01;
		unit 0 {
			family {
				inet {
					address 192.168.1.254/24;
				}
				inet6 {
					address fd00:a1::ffff/64;
				}
			}
		}
	}
	ge-0/0/3 {
		description to:POLA-PCE;
		unit 0 {
			family inet6 {
				address fd00::1/64;
			}
		}
	}
	lo0 {
		unit 0 {
			family {
				iso {
					address 49.0000.0000.0aff.0001.00;
				}
				inet6 {
					address fd00:ffff::1/128;
				}
			}
		}
	}
}
policy-options {
	policy-statement EXPORT-POLICY-1 {
		term ROUTE-TARGET {
			then {
				community add VRF1-65000-RT;
			}
		}
		term ADD-COLOR-100 {
			then {
				community add COLOR-1;
			}
		}
		term OVERRIDE-NH-END {
			then {
				next-hop fd00:ffff:1:0:1::;
			}
		}
		term REDIST-DIRECT {
			from {
				protocol direct;
			}
			then accept;
		}
	}
	policy-statement IMPORT-POLICY-1 {
		term ROUTE-TARGET-65000 {
			from {
				community VRF1-65000-RT;
			}
			then accept;
		}
	}
	policy-statement MAP-COLOR {
		term 1 {
			from {
				family inet-vpn;
			}
			then {
				accept;
				resolution-map MAP-COLOR;
			}
		}
		term 2 {
			from {
				family inet6-vpn;
			}
			then {
				accept;
				resolution-map MAP-COLOR;
			}
		}
	}
	policy-statement MPATH-RESOLVE {
		then multipath-resolve;
	}
	community COLOR-1 members color:0:1;
	community VRF1-65000-RT members target:65000:1;
	resolution-map MAP-COLOR {
		mode ip-color;
	}
}
routing-instances {
	CUST-A {
		instance-type vrf;
		interface ge-0/0/2.0;
		route-distinguisher 65000:1;
		vrf-import IMPORT-POLICY-1;
		vrf-export EXPORT-POLICY-1;
		vrf-target target:65000:1;
		vrf-table-label;
		protocols {
			bgp {
				family {
					inet {
						unicast;
					}
					inet6 {
						unicast;
					}
				}
				source-packet-routing {
					srv6 {
						locator LOC1 {
							end-dt4-sid fd00:ffff:1:0:4:a::;
							end-dt6-sid fd00:ffff:1:0:6:a::;
						}
					}
				}
			}
		}
	}
}
routing-options {
	source-packet-routing {
		srv6 {
			locator LOC1 fd00:ffff:1::/64;
			no-reduced-srh;
		}
	}
	resolution {
		preserve-nexthop-hierarchy;
		rib bgp.l3vpn-inet6.0 {
			import MPATH-RESOLVE;
			inet6color-import MPATH-RESOLVE;
		}
		rib bgp.l3vpn.0 {
			import MPATH-RESOLVE;
			inet6color-import MPATH-RESOLVE;
		}
		rib inet6.0 {
			import MPATH-RESOLVE;
		}
		rib inet.0 {
			import MPATH-RESOLVE;
		}
	}
	router-id 10.255.0.1;
	autonomous-system 65000;
	forwarding-table {
		srv6-chain-merge;
	}
}
protocols {
	bgp {
		family {
			inet-vpn {
				unicast {
					extended-nexthop;
					advertise-srv6-service;
					accept-srv6-service;
				}
			}
			inet6-vpn {
				unicast {
					advertise-srv6-service;
					accept-srv6-service;
				}
			}
		}
		group iBGP {
			type internal;
			local-address fd00:ffff::1;
			import MAP-COLOR;
			family {
				inet {
					unicast {
						extended-nexthop;
						advertise-srv6-service;
					}
				}
				inet-vpn {
					unicast {
						extended-nexthop;
						advertise-srv6-service;
						accept-srv6-service;
					}
				}
				inet6 {
					unicast {
						extended-nexthop-color;
						advertise-srv6-service;
					}
				}
				inet6-vpn {
					unicast {
						advertise-srv6-service;
						accept-srv6-service;
					}
				}
			}
			neighbor fd00:ffff::2;
		}
		multipath;
	}
	isis {
		interface ge-0/0/0.0 {
			point-to-point;
		}
		interface ge-0/0/1.0 {
			point-to-point;
		}
		interface lo0.0 {
			passive;
		}
		source-packet-routing {
			srv6 {
				locator LOC1 {
					end-sid fd00:ffff:1:0:1::;
				}
			}
		}
		level 1 disable;
		level 2 wide-metrics-only;
		no-ipv4-routing;
		topologies {
			ipv6-unicast;
		}
	}
	mpls {
		lsp-external-controller pccd;
	}
	source-packet-routing {
		lsp-external-controller pccd;
		srv6;
	}
	pcep {
		pce POLA-PCE {
			local-ipv6-address fd00::1;
			destination-ipv6-address fd00::ffff;
			pce-type active;
			pce-type stateful;
			lsp-provisioning;
			spring-capability;
			srv6-capability;
		}
	}
}
commit

configure
chassis {
	network-services enhanced-ip;
}
interfaces {
	ge-0/0/0 {
		description to:pe02;
		unit 0 {
			family {
				iso;
				mpls;
				inet {
					address 10.0.0.2/24;
				}
			}
		}
	}
	ge-0/0/1 {
		description to:pe03;
		unit 0 {
			family {
				iso;
				mpls;
				inet {
					address 10.0.0.9/24;
				}
			}
		}
	}
	ge-0/0/2 {
		description to:pce;
		unit 0 {
			family inet {
				address 10.0.255.2/24;
			}
		}
	}
	lo0 {
		unit 0 {
			family {
				inet {
					address 10.255.0.2/32;
				}
				iso {
					address 49.0000.0000.0000.0002.00;
				}
			}
		}
	}
}
protocols {
	isis {
		interface ge-0/0/0.0 {
			point-to-point;
		}
		interface ge-0/0/1.0 {
			point-to-point;
		}
		interface ge-0/0/2.0 {
			point-to-point;
		}
		interface lo0.0 {
			passive;
		}
		source-packet-routing {
			srgb {
				start-label 16000;
				index-range 8000;
			}
			node-segment {
				ipv4-index 2;
			}
		}
		level 1 disable;
		level 2 wide-metrics-only;
	}
	mpls {
		lsp-external-controller pccd;
		icmp-tunneling;
		interface ge-0/0/0.0;
		interface ge-0/0/1.0;
		interface ge-0/0/2.0;
	}
	pcep {
		pce POLA-PCE {
			local-address 10.0.255.2;
			destination-ipv4-address 10.0.255.254;
			pce-type active;
			pce-type stateful;
			lsp-provisioning;
			spring-capability;
		}
	}
	source-packet-routing {
		lsp-external-controller pccd;
	}
}
commit

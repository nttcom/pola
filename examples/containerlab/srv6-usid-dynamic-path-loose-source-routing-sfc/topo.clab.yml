name: srv6-usid-dynamic-path-loose-source-routing-sfc
topology:
  kinds:
    xrd:
      image: ios-xr/xrd-control-plane:24.4.1
    juniper_vjunosrouter:
      image: vrnetlab/juniper_vjunos-router:25.2R1.9
  nodes:
    pe01:
      kind: xrd
      startup-config: startup-configs/pe01.cfg
    pe02:
      kind: juniper_vjunosrouter
      startup-config: startup-configs/pe02.cfg
    p01:
      kind: xrd
      startup-config: startup-configs/p01.cfg
    p02:
      kind: xrd
      startup-config: startup-configs/p02.cfg
    pola:
      kind: linux
      image: ghcr.io/nttcom/pola:latest-dev
      binds:
        - pola/polad.yaml:/pola/polad.yaml
        - sr-policies/pe02-policy1.yaml:/pola/pe02-policy1.yaml
      exec:
        - ip addr add 10.0.0.3/24 dev eth1
        - ip -6 addr add fd00::3/64 dev eth1
    gobgp-server:
      kind: linux
      image: wbitt/network-multitool:latest
      binds:
        - bin/gobgpd:/bin/gobgpd
        - bin/gobgp:/bin/gobgp
        - gobgpd/gobgp-server.yml:/gobgpd.yml
      exec:
        - ip addr add 10.0.0.4/24 dev eth1
        - ip -6 addr add fd00::4/64 dev eth1
        - gobgpd -f /gobgpd.yml > /dev/null 2>&1 &
    gobgp-client:
      kind: linux
      image: wbitt/network-multitool:latest
      binds:
        - bin/gobgpd:/bin/gobgpd
        - bin/gobgp:/bin/gobgp
        - gobgpd/gobgp-client.yml:/gobgpd.yml
      exec:
        - ip addr add 10.0.0.5/24 dev eth1
        - ip -6 addr add fd00::5/64 dev eth1
        - gobgpd -f /gobgpd.yml > /dev/null 2>&1 &
    switch:
      kind: bridge
  links:
    # SRv6 domain
    - endpoints: ["pe01:Gi0-0-0-0", "p01:Gi0-0-0-0"]
    - endpoints: ["pe01:Gi0-0-0-1", "p02:Gi0-0-0-0"]
    - endpoints: ["pe02:eth1", "p01:Gi0-0-0-1"]
    - endpoints: ["pe02:eth2", "p02:Gi0-0-0-1"]
    - endpoints: ["p01:Gi0-0-0-2", "p02:Gi0-0-0-2"]
    # switch
    - endpoints: ["pe01:Gi0-0-0-2", "switch:eth1"]
    - endpoints: ["pe02:eth3", "switch:eth2"]
    - endpoints: ["pola:eth1", "switch:eth3"]
    - endpoints: ["gobgp-server:eth1", "switch:eth4"]
    - endpoints: ["gobgp-client:eth1", "switch:eth5"]

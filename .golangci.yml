version: "2"
linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - contextcheck
    - copyloopvar
    - depguard
    - dupl
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gosec
    - iface
    - intrange
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nestif
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - reassign
    - revive
    - spancheck
    - testifylint
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    depguard:
      rules:
        logging:
          files:
            - '!**/pkg/logger/*.go'
          deny:
            - pkg: log
              desc: use pkg/logger instead
            - pkg: go.uber.org/zap
              desc: use pkg/logger instead
        gobgp:
          files:
            - '!**/internal/gobgp/*.go'
          deny:
            - pkg: github.com/osrg/gobgp/v4
              desc: use internal/gobgp instead
    dupl:
      threshold: 150
    errcheck:
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: true
    gochecksumtype:
      default-signifies-exhaustive: false
    gocognit:
      min-complexity: 20
    goconst:
      ignore-tests: true
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
      disabled-checks:
        # Duplicates nolintlint.require-explanation.
        - whyNoLint
        # Not suitable for this codebase.
        - hugeParam
        - rangeValCopy
        # PCEP wire-format test data is intentional.
        - commentedOutCode
    gocyclo:
      min-complexity: 15
    godot:
      scope: declarations
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    iface:
      enable:
        - identical
        - unused
    nolintlint:
      require-explanation: true
      require-specific: true
    prealloc:
      simple: true
    revive:
      rules:
        - name: error-naming
        - name: error-strings
        - name: exported
        - name: indent-error-flow
        - name: receiver-naming
        - name: unused-parameter
        - name: unreachable-code
        - name: var-naming
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - containedctx
          - dupl
          - gosec
          - noctx
      - path: ^tools/coverage-diff/
        linters:
          - gosec
formatters:
  enable:
    - gofumpt
    - goimports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

version: "2"
linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - contextcheck
    - copyloopvar
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - fatcontext
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - iface
    - intrange
    - loggercheck
    - makezero
    - mirror
    - misspell
    - modernize
    - nilerr
    - nilnesserr
    - nolintlint
    - perfsprint
    - reassign
    - revive
    - spancheck
    - testifylint
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    gochecksumtype:
      default-signifies-exhaustive: false
    goconst:
      ignore-tests: true
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    iface:
      enable:
        - identical
        - unused
    loggercheck:
      require-string-key: true
      no-printf-like: true
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: error-naming
        - name: error-strings
        - name: exported
        - name: indent-error-flow
        - name: receiver-naming
        - name: unused-parameter
        - name: unreachable-code
        - name: var-naming
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - containedctx
          - gosec
      - path: ^tools/coverage-diff/
        linters:
          - gosec
      - path: ^examples/
        text: exitAfterDefer
        linters:
          - gocritic
formatters:
  enable:
    - gofumpt
    - goimports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
